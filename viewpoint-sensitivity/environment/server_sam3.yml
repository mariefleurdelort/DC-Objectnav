name: vps-sam3
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # torch via pip, not conda
      - torch
      - torchvision
      # SAM 3 (facebook/sam3, released Nov 2025) landed in transformers as Sam3Model / Sam3Processor
      - transformers>=4.57.0
      - fastapi
      - "uvicorn[standard]"
      - pillow
      - numpy<2
      - python-multipart
