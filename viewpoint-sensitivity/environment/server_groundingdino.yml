name: vps-groundingdino
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # torch installed via pip (not conda) deliberately: mixing the `pytorch` +
      # `nvidia` conda channels with conda-forge repeatedly hits ClobberErrors
      # (e.g. conda-forge's jpeg vs. the pytorch channel's libjpeg-turbo fighting
      # over the same installed file paths). PyPI's torch wheel bundles its own
      # CUDA runtime via nvidia-*-cu12 deps, so it doesn't need a matching conda
      # cudatoolkit -- only a driver new enough to support that CUDA version
      # (any driver from the last ~3 years comfortably covers current torch wheels).
      - torch
      - torchvision
      - transformers>=4.40.0   # AutoModelForZeroShotObjectDetection + IDEA-Research/grounding-dino-tiny
      - fastapi
      - "uvicorn[standard]"
      - pillow
      - numpy<2
      - python-multipart
