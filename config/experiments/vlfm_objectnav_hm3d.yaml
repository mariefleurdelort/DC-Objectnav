# @package _global_
defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /benchmark/nav/objectnav: objectnav_hm3d
  - /habitat/task/lab_sensors:
      - base_explorer
      - compass_sensor
      - gps_sensor
      - heading_sensor
      - frontier_sensor
  - /habitat/task/measurements:
    - frontier_exploration_map
    - traveled_stairs
  - /habitat_baselines/rl/policy: vlfm_policy
  - _self_
habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
  simulator:
    scene_dataset: data/scene_datasets/hm3d/val/hm3d_annotated_val_basis.scene_dataset_config.json
    agents:
      main_agent:
        max_climb: 0.2
        max_slope: 45.0
habitat_baselines:
  evaluate: True
  num_environments: 1
  trainer_name: "vlfm"
  load_resume_state_config: False
  test_episode_count: -1
  eval:
    should_load_ckpt: False
    video_option: []